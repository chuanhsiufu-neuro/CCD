<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="UTF-8">
<style>
    body { font-family: sans-serif; padding: 20px; background-color: #f5f5f5;}
    .container { background-color: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #dcedc8; }
    input[type="text"] { width: 80px; padding: 4px; text-align: center; }
    .btn { background-color: #4CAF50; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top:10px;}
    .btn:hover { background-color: #45a049; }
    .upload-section { background-color: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
</style>

<div class="container">
    <h2 style="text-align: center;">頸動脈超音波報告 AI 辨識打包系統</h2>
    
    <!-- AI 辨識上傳區 -->
    <div class="upload-section">
        <label><strong>1. 輸入 Gemini API Key: </strong></label>
        <input type="password" id="api_key" placeholder="請輸入API碼" style="width: 250px; text-align: left;">
        <br><br>
        <label><strong>2. 上傳紙本報告照片: </strong></label>
        <input type="file" id="image_input" accept="image/*">
        <button class="btn" style="background-color: #2196F3; width: auto; padding: 8px 16px;" onclick="processImage()">開始 AI 辨識</button>
        <div id="status_msg" style="color: blue; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- 數據確認區 -->
    <div style="margin-bottom: 20px;">
        <label><strong>病歷號 (Chart No.): </strong></label>
        <input type="text" id="chart_no" value="" style="width: 150px;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Vessel</th>
                <th>Systolic V.</th>
                <th>Diastolic V.</th>
                <th>R.I.</th>
                <th>Comment</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1. Right CCA</td>
                <td><input type="text" id="r_cca_sys" value=""></td>
                <td><input type="text" id="r_cca_dia" value=""></td>
                <td><input type="text" id="r_cca_ri" value=""></td>
                <td><input type="text" id="r_cca_cmt" value="Normal"></td>
            </tr>
            <tr>
                <td>2. Right ICA</td>
                <td><input type="text" id="r_ica_sys" value=""></td>
                <td><input type="text" id="r_ica_dia" value=""></td>
                <td><input type="text" id="r_ica_ri" value=""></td>
                <td><input type="text" id="r_ica_cmt" value="Normal"></td>
            </tr>
            <tr>
                <td>3. Right ECA</td>
                <td><input type="text" id="r_eca_sys" value=""></td>
                <td><input type="text" id="r_eca_dia" value=""></td>
                <td><input type="text" id="r_eca_ri" value=""></td>
                <td><input type="text" id="r_eca_cmt" value="Normal"></td>
            </tr>
            <tr>
                <td>4. Left CCA</td>
                <td><input type="text" id="l_cca_sys" value=""></td>
                <td><input type="text" id="l_cca_dia" value=""></td>
                <td><input type="text" id="l_cca_ri" value=""></td>
                <td><input type="text" id="l_cca_cmt" value="Normal"></td>
            </tr>
            <tr>
                <td>5. Left ICA</td>
                <td><input type="text" id="l_ica_sys" value=""></td>
                <td><input type="text" id="l_ica_dia" value=""></td>
                <td><input type="text" id="l_ica_ri" value=""></td>
                <td><input type="text" id="l_ica_cmt" value="Normal"></td>
            </tr>
            <tr>
                <td>6. Left ECA</td>
                <td><input type="text" id="l_eca_sys" value=""></td>
                <td><input type="text" id="l_eca_dia" value=""></td>
                <td><input type="text" id="l_eca_ri" value=""></td>
                <td><input type="text" id="l_eca_cmt" value="Normal"></td>
            </tr>
        </tbody>
    </table>

    <table>
        <thead>
            <tr>
                <th>Vertebral Artery</th>
                <th>Diameter (cm)</th>
                <th>Flow (ml/min)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Right VA</td>
                <td><input type="text" id="r_va_dia" value=""></td>
                <td><input type="text" id="r_va_flow" value=""></td>
            </tr>
            <tr>
                <td>Left VA</td>
                <td><input type="text" id="l_va_dia" value=""></td>
                <td><input type="text" id="l_va_flow" value=""></td>
            </tr>
        </tbody>
    </table>

    <button class="btn" onclick="copyVBSCode()">確認數據無誤，點擊複製自動填寫腳本</button>
</div>

<script>
    window.onload = function() {
        var savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('api_key').value = savedKey;
        }
    };

    async function processImage() {
        const apiKey = document.getElementById('api_key').value;
        const fileInput = document.getElementById('image_input');
        const statusMsg = document.getElementById('status_msg');

        if (!apiKey) {
            alert('請輸入 Gemini API Key');
            return;
        }
        
        localStorage.setItem('gemini_api_key', apiKey);

        if (!fileInput.files.length) {
            alert('請先選擇一張照片');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onloadend = async function() {
            const base64Data = reader.result.split(',')[1];

            // === 核心修改：自動偵測可用模型 ===
            statusMsg.innerText = "🔍 正在向 Google 查詢可用的 AI 模型...";
            statusMsg.style.color = "blue";
            
            let targetModel = "";
            try {
                const modelRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const modelData = await modelRes.json();
                
                if (modelData.models) {
                    // 尋找支援內容生成，且為 1.5 版的模型 (優先挑選 flash 或 pro)
                    const validModels = modelData.models.filter(m => 
                        m.supportedGenerationMethods.includes('generateContent') && 
                        (m.name.includes('gemini-1.5-flash') || m.name.includes('gemini-1.5-pro'))
                    );
                    
                    if (validModels.length > 0) {
                        targetModel = validModels[0].name; // 自動取得最匹配的模型名稱
                    } else {
                        // 如果都沒有 1.5，退而求其次找任何支援的 gemini 模型
                        const anyGemini = modelData.models.find(m => 
                            m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini')
                        );
                        targetModel = anyGemini ? anyGemini.name : 'models/gemini-1.5-flash';
                    }
                } else {
                    targetModel = 'models/gemini-1.5-flash'; // 預設防呆
                }
            } catch (e) {
                console.error("查詢模型清單失敗，改用預設值", e);
                targetModel = 'models/gemini-1.5-flash';
            }

            // 確保模型名稱前面有 models/ 前綴
            if (!targetModel.startsWith('models/')) {
                targetModel = 'models/' + targetModel;
            }

            statusMsg.innerText = `⏳ 已鎖定模型 (${targetModel.replace('models/', '')})，正在分析超音波數據...`;

            const promptText = `
                你是一位專業的醫療數據助理。請辨識這張手寫頸動脈超音波報告，並提取以下數據：
                1. 左上角的「病歷號」。
                2. 圖片最下方的「Doppler Flow Study」數據區塊。
                - 對於 CCA, ICA, ECA，斜線前後的數值分別代表 Systolic / Diastolic。
                - 對於 VA，斜線前後的數值分別代表 Diameter / Flow。
                - 提取對應的 R.I. 數值。
                
                請嚴格以 JSON 格式輸出，不要包含任何其他解釋文字或 Markdown 標籤。JSON 的 Key 必須完全符合以下格式：
                {
                    "chart_no": "病歷號",
                    "r_cca_sys": "數值", "r_cca_dia": "數值", "r_cca_ri": "數值",
                    "r_ica_sys": "數值", "r_ica_dia": "數值", "r_ica_ri": "數值",
                    "r_eca_sys": "數值", "r_eca_dia": "數值", "r_eca_ri": "數值",
                    "r_va_dia": "數值", "r_va_flow": "數值",
                    "l_cca_sys": "數值", "l_cca_dia": "數值", "l_cca_ri": "數值",
                    "l_ica_sys": "數值", "l_ica_dia": "數值", "l_ica_ri": "數值",
                    "l_eca_sys": "數值", "l_eca_dia": "數值", "l_eca_ri": "數值",
                    "l_va_dia": "數值", "l_va_flow": "數值"
                }
            `;

            const requestBody = {
                contents: [{
                    parts: [
                        {text: promptText},
                        {inlineData: {mimeType: file.type, data: base64Data}}
                    ]
                }]
            };

            try {
                // 使用剛剛自動偵測到的模型名稱進行呼叫
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${targetModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();
                
                if (result.error) {
                    console.error("API 錯誤:", result.error);
                    statusMsg.innerText = "❌ 辨識失敗：" + result.error.message;
                    statusMsg.style.color = "red";
                    return;
                }

                if (result.candidates && result.candidates.length > 0) {
                    let aiText = result.candidates[0].content.parts[0].text;
                    aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    try {
                        const extractedData = JSON.parse(aiText);
                        
                        for (const key in extractedData) {
                            if (document.getElementById(key)) {
                                document.getElementById(key).value = extractedData[key];
                            }
                        }
                        statusMsg.innerText = "✅ 辨識完成！請核對數據。";
                        statusMsg.style.color = "green";
                    } catch (e) {
                        console.error("JSON 解析錯誤:", e, aiText);
                        statusMsg.innerText = "❌ AI 回傳格式錯誤，請再試一次。";
                        statusMsg.style.color = "red";
                    }
                } else {
                    statusMsg.innerText = "❌ 辨識失敗，請重試。";
                    statusMsg.style.color = "red";
                }

            } catch (error) {
                console.error("連線錯誤:", error);
                statusMsg.innerText = "❌ 發生連線錯誤，請檢查網路狀態。";
                statusMsg.style.color = "red";
            }
        };

        reader.readAsDataURL(file);
    }

    function copyVBSCode() {
        var vbsContent = 'Set WshShell = WScript.CreateObject("WScript.Shell")\n';
        vbsContent += 'WScript.Sleep 3000\n\n';

        var fieldIds = [
            'r_cca_sys', 'r_cca_dia', 'r_cca_ri', 'r_cca_cmt',
            'r_ica_sys', 'r_ica_dia', 'r_ica_ri', 'r_ica_cmt',
            'r_eca_sys', 'r_eca_dia', 'r_eca_ri', 'r_eca_cmt',
            'l_cca_sys', 'l_cca_dia', 'l_cca_ri', 'l_cca_cmt',
            'l_ica_sys', 'l_ica_dia', 'l_ica_ri', 'l_ica_cmt',
            'l_eca_sys', 'l_eca_dia', 'l_eca_ri', 'l_eca_cmt',
            'r_va_dia', 'r_va_flow',
            'l_va_dia', 'l_va_flow'
        ];

        fieldIds.forEach(function(id) {
            var element = document.getElementById(id);
            if (element && element.value !== "") {
                vbsContent += 'WshShell.SendKeys "' + element.value + '"\n';
            }
            vbsContent += 'WshShell.SendKeys "{TAB}"\n';
        });

        navigator.clipboard.writeText(vbsContent).then(function() {
            alert("腳本已成功複製！\n請打開桌面上的 test.vbs 檔案，貼上並儲存。");
        }).catch(function(err) {
            alert("複製失敗，請手動框選文字複製。");
        });
    }
</script>
</html>
